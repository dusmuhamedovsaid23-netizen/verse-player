<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verse — синхронизированный текст песен</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="bg-layer" aria-hidden="true">
  <div id="bg-image"></div>
  <div id="bg-gradient"></div>
  <div id="bg-noise"></div>
</div>

<div id="app" class="app">

  <!-- Top bar -->
  <header class="topbar">
    <button class="icon-btn" id="btn-upload" title="Загрузить песню" aria-label="Загрузить песню">
      <svg viewBox="0 0 24 24"><path d="M12 4v10.5m0 0 3.5-3.5M12 14.5 8.5 11M5 17.5v1.75A1.75 1.75 0 0 0 6.75 21h10.5A1.75 1.75 0 0 0 19 19.25V17.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="track-meta">
      <p class="track-title" id="track-title">Загрузите песню, чтобы начать</p>
      <p class="track-artist" id="track-artist">Verse</p>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="btn-library" title="Мои песни" aria-label="Мои песни">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7M18.1 18.1l-1.7-1.7M7.6 7.6 5.9 5.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-fullscreen" title="Во весь экран" aria-label="Во весь экран">
        <svg viewBox="0 0 24 24"><path d="M9 4H5.75A1.75 1.75 0 0 0 4 5.75V9M15 4h3.25A1.75 1.75 0 0 1 20 5.75V9M9 20H5.75A1.75 1.75 0 0 1 4 18.25V15M15 20h3.25A1.75 1.75 0 0 0 20 18.25V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Lyrics stage -->
  <main class="stage">
    <div class="cover-panel" id="cover-panel">
      <div class="cover-art" id="cover-art"><span id="cover-fallback">🎵</span></div>
    </div>

    <div class="lyrics-panel">
      <div class="lyrics-viewport" id="lyrics-viewport">
        <div class="lyrics-list" id="lyrics-list">
          <div class="empty-state" id="empty-state">
            <p>Пока тут пусто</p>
            <span>Загрузите аудио и текст песни, чтобы увидеть синхронизированные строки</span>
            <button class="btn-primary" id="btn-upload-empty">Загрузить песню</button>
          </div>
        </div>
      </div>
      <div class="lyrics-fade lyrics-fade-top"></div>
      <div class="lyrics-fade lyrics-fade-bottom"></div>
    </div>
  </main>

  <!-- Manual sync bar -->
  <div class="sync-bar" id="sync-bar" hidden>
    <div class="sync-info">
      <span class="sync-dot"></span>
      <span>Ручная синхронизация — строка <b id="sync-line-index">1</b> из <span id="sync-line-total">0</span></span>
    </div>
    <div class="sync-current" id="sync-current-text">—</div>
    <div class="sync-actions">
      <button class="btn-ghost" id="btn-sync-back">← Назад</button>
      <button class="btn-primary" id="btn-sync-mark">Отметить (Enter)</button>
      <button class="btn-ghost" id="btn-sync-skip">Пропустить →</button>
      <button class="btn-ghost" id="btn-sync-done">Готово</button>
    </div>
  </div>

  <!-- Player bar -->
  <footer class="player-bar" id="player-bar">
    <div class="progress-row">
      <span class="time time-current" id="time-current">0:00</span>
      <input type="range" id="seek" class="seek" min="0" max="1000" value="0" step="1">
      <span class="time time-total" id="time-total">0:00</span>
    </div>
    <div class="controls-row">
      <div class="controls-side">
        <button class="icon-btn" id="btn-loop" title="Повтор" aria-label="Повтор трека">
          <svg viewBox="0 0 24 24"><path d="M6 9V7.75A2.75 2.75 0 0 1 8.75 5H17M17 5l-2.5-2.5M17 5l-2.5 2.5M18 15v1.25A2.75 2.75 0 0 1 15.25 19H7M7 19l2.5 2.5M7 19l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="controls-main">
        <button class="icon-btn" id="btn-back10" title="Назад 10с" aria-label="Назад 10 секунд">
          <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.32 4M5.5 5v4h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="play-btn" id="btn-play" title="Play/Pause" aria-label="Воспроизвести">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="btn-fwd10" title="Вперёд 10с" aria-label="Вперёд 10 секунд">
          <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 0 6.32 4M18.5 5v4h-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="controls-side controls-volume">
        <button class="icon-btn" id="btn-mute" title="Громкость" aria-label="Громкость">
          <svg viewBox="0 0 24 24"><path d="M4 10v4h3.5L12 17.5v-11L7.5 10H4Z" fill="currentColor"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        </button>
        <input type="range" id="volume" class="volume" min="0" max="100" value="80">
      </div>
      <button class="icon-btn hide-player-btn" id="btn-hide-player" title="Скрыть плеер" aria-label="Скрыть плеер">
        <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>

  <button class="show-player-btn" id="btn-show-player" hidden aria-label="Показать плеер">
    <svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<!-- Upload modal -->
<div class="modal-backdrop" id="upload-modal" hidden>
  <div class="modal upload-modal">
    <div class="modal-head">
      <h2>Загрузить песню</h2>
      <button class="icon-btn" id="btn-close-upload">✕</button>
    </div>

    <div class="upload-grid">
      <label class="drop-zone" id="drop-audio">
        <input type="file" id="input-audio" accept="audio/*" hidden>
        <span class="drop-icon">🎧</span>
        <span class="drop-title">Аудиофайл</span>
        <span class="drop-sub" id="drop-audio-name">MP3, WAV, OGG — перетащите или выберите</span>
      </label>

      <label class="drop-zone" id="drop-cover">
        <input type="file" id="input-cover" accept="image/*" hidden>
        <span class="drop-icon">🖼️</span>
        <span class="drop-title">Обложка</span>
        <span class="drop-sub" id="drop-cover-name">JPG, PNG — необязательно</span>
      </label>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="input-title">Название</label>
        <input type="text" id="input-title" placeholder="Название песни">
      </div>
      <div class="field">
        <label for="input-artist">Исполнитель</label>
        <input type="text" id="input-artist" placeholder="Имя исполнителя">
      </div>
    </div>

    <div class="field">
      <label for="input-lyrics">Текст песни</label>
      <textarea id="input-lyrics" rows="7" placeholder="Вставьте обычный текст или LRC с таймкодами, например:
[00:12.50] Первая строка
[00:16.20] Вторая строка"></textarea>
      <span class="field-hint">Если таймкодов нет — после загрузки предложим ручную синхронизацию.</span>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" id="btn-load-demo">Загрузить пример</button>
      <button class="btn-primary" id="btn-confirm-upload">Загрузить и открыть</button>
    </div>
  </div>
</div>

<!-- Library modal -->
<div class="modal-backdrop" id="library-modal" hidden>
  <div class="modal library-modal">
    <div class="modal-head">
      <h2>Мои песни</h2>
      <button class="icon-btn" id="btn-close-library">✕</button>
    </div>
    <div class="library-list" id="library-list"></div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal settings-modal">
    <div class="modal-head">
      <h2>Настройки</h2>
      <button class="icon-btn" id="btn-close-settings">✕</button>
    </div>

    <div class="setting-row">
      <label>Размер текста</label>
      <input type="range" id="setting-fontsize" min="18" max="56" value="30">
    </div>

    <div class="setting-row">
      <label>Шрифт текста</label>
      <select id="setting-font">
        <option value="'Manrope', sans-serif">Manrope (по умолчанию)</option>
        <option value="'Fraunces', serif">Fraunces (serif)</option>
        <option value="ui-monospace, Menlo, monospace">Моноширинный</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
    </div>

    <div class="setting-row">
      <label>Скорость анимации текста</label>
      <input type="range" id="setting-speed" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="setting-row setting-row-between">
      <label>Синхронизировать позже</label>
      <button class="btn-ghost" id="btn-resync">Пересинхронизировать вручную</button>
    </div>

    <div class="setting-row setting-row-between">
      <label>Данные</label>
      <button class="btn-ghost btn-danger" id="btn-clear-data">Очистить все сохранённые песни</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script type="module" src="js/main.js"></script>
</body>
</html>
